<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mount Paektu at dawn with a Gojoseon-era dolmen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2560"/>
      <stop offset="0.28" stop-color="#5a559f"/>
      <stop offset="0.52" stop-color="#d98b93"/>
      <stop offset="0.72" stop-color="#ffc98a"/>
      <stop offset="1" stop-color="#fff0c9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffb877" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d76b8"/>
      <stop offset="0.6" stop-color="#5a5595"/>
      <stop offset="1" stop-color="#3f3c78"/>
    </linearGradient>
    <linearGradient id="peakShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1b4a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b1b4a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48fb8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0a8a0" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e5f9c"/>
      <stop offset="1" stop-color="#b27d9a"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2df" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff2df" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff2df" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3350"/>
      <stop offset="1" stop-color="#171a30"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd8e2"/>
      <stop offset="0.5" stop-color="#d8f6f2"/>
      <stop offset="1" stop-color="#6fc3d6"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4460"/>
      <stop offset="1" stop-color="#1a1b32"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#0b0e26" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0e26" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="70" cy="60" r="1.6"/><circle cx="150" cy="120" r="1.2"/><circle cx="230" cy="45" r="1.8"/>
    <circle cx="300" cy="100" r="1"/><circle cx="520" cy="55" r="1.5"/><circle cx="600" cy="110" r="1.2"/>
    <circle cx="690" cy="50" r="1.8"/><circle cx="745" cy="130" r="1.1"/><circle cx="110" cy="190" r="1"/>
    <circle cx="660" cy="190" r="1"/><circle cx="440" cy="30" r="1.2"/><circle cx="360" cy="150" r="0.9"/>
  </g>

  <!-- sun and glow -->
  <circle cx="400" cy="215" r="260" fill="url(#sunGlow)"/>
  <circle cx="400" cy="190" r="58" fill="#fffbe9"/>
  <circle cx="400" cy="190" r="70" fill="none" stroke="#fff3c8" stroke-opacity="0.5" stroke-width="3"/>

  <!-- birds (cranes) -->
  <g fill="none" stroke="#fff8ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M250 140 q14 -16 30 -2 q16 -14 30 2"/>
    <path d="M300 100 q10 -11 21 -1 q11 -10 21 1" stroke-width="2.6"/>
    <path d="M520 130 q12 -14 26 -2 q14 -12 26 2" stroke-width="3"/>
    <path d="M572 92 q8 -9 17 -1 q9 -8 17 1" stroke-width="2.2"/>
  </g>

  <!-- far range -->
  <path d="M0 430 L60 385 L120 415 L200 345 L270 400 L330 330 L400 400 L470 335 L540 395 L620 340 L690 400 L750 365 L800 395 L800 520 L0 520 Z" fill="url(#far)"/>

  <!-- mist behind main peak -->
  <ellipse cx="400" cy="420" rx="420" ry="26" fill="url(#mist)" opacity="0.7"/>

  <!-- Mount Paektu -->
  <path d="M30 500 L170 380 L250 318 L300 268 L345 238 Q400 256 455 238 L505 268 L560 318 L640 380 L770 500 Z" fill="url(#peak)"/>
  <!-- shaded right flank -->
  <path d="M455 238 L505 268 L560 318 L640 380 L770 500 L520 500 L470 380 L445 300 Z" fill="url(#peakShade)"/>
  <!-- ridges -->
  <g fill="none" stroke="#2c2966" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M300 268 L262 400 L232 480"/>
    <path d="M345 240 L330 340 L300 470"/>
    <path d="M455 238 L470 340 L500 470"/>
    <path d="M505 268 L540 390 L590 480"/>
  </g>
  <!-- snow cap -->
  <path d="M250 318 L300 268 L345 238 Q400 256 455 238 L505 268 L560 318 L536 308 L512 330 L488 300 L462 334 L432 296 L406 336 L380 298 L350 334 L324 300 L296 332 L272 306 Z" fill="#fdf7ee"/>
  <path d="M455 238 L505 268 L560 318 L536 308 L512 330 L488 300 L462 334 L432 296 Z" fill="#c9c3e6" opacity="0.55"/>
  <!-- Heaven Lake (Cheonji) in the crater -->
  <ellipse cx="400" cy="246" rx="52" ry="9" fill="url(#lake)"/>
  <ellipse cx="400" cy="244" rx="52" ry="9" fill="none" stroke="#fdf7ee" stroke-width="3"/>
  <ellipse cx="386" cy="246" rx="18" ry="2.4" fill="#ffffff" opacity="0.7"/>

  <!-- mid ridges -->
  <path d="M0 470 L90 430 L180 460 L260 420 L340 462 L420 500 L0 500 Z" fill="url(#mid)"/>
  <path d="M800 465 L720 425 L640 455 L560 415 L480 460 L420 500 L800 500 Z" fill="url(#mid)" opacity="0.95"/>

  <!-- mist bands -->
  <ellipse cx="220" cy="470" rx="230" ry="20" fill="url(#mist)"/>
  <ellipse cx="620" cy="462" rx="240" ry="18" fill="url(#mist)" opacity="0.9"/>
  <ellipse cx="410" cy="492" rx="360" ry="16" fill="url(#mist)" opacity="0.75"/>

  <!-- foreground ground -->
  <path d="M0 520 Q120 492 240 508 T480 506 T800 498 L800 600 L0 600 Z" fill="url(#ground)"/>
  <path d="M0 520 Q120 492 240 508 T480 506 T800 498" fill="none" stroke="#ffd9a0" stroke-opacity="0.55" stroke-width="2"/>

  <!-- dolmen (Gojoseon-era megalith) -->
  <g>
    <ellipse cx="205" cy="522" rx="120" ry="10" fill="#0f1226" opacity="0.55" filter="url(#soft2)"/>
    <!-- uprights -->
    <path d="M128 522 L136 458 L168 452 L172 522 Z" fill="url(#stone)"/>
    <path d="M238 522 L242 452 L276 460 L286 522 Z" fill="url(#stone)"/>
    <!-- capstone -->
    <path d="M100 462 Q150 430 210 436 Q268 434 312 454 Q316 466 290 470 Q210 480 120 474 Q98 472 100 462 Z" fill="url(#stone)"/>
    <path d="M100 462 Q150 430 210 436 Q268 434 312 454" fill="none" stroke="#ffd79a" stroke-width="2.4" stroke-opacity="0.85" stroke-linecap="round"/>
    <path d="M136 458 L128 522 M242 452 L238 522" stroke="#ffcf94" stroke-width="1.6" stroke-opacity="0.6" fill="none"/>
    <!-- inner glow through opening -->
    <path d="M172 522 L168 470 Q205 476 242 470 L238 522 Z" fill="#ffd9a0" opacity="0.32"/>
  </g>

  <!-- pines, right -->
  <g fill="#161a30">
    <g transform="translate(610 508)">
      <rect x="-3" y="-20" width="6" height="26"/>
      <path d="M0 -150 L-34 -90 L-14 -92 L-46 -46 L-18 -50 L-54 -8 L54 -8 L18 -50 L46 -46 L14 -92 L34 -90 Z"/>
    </g>
    <g transform="translate(676 512) scale(0.82)">
      <rect x="-3" y="-20" width="6" height="26"/>
      <path d="M0 -150 L-34 -90 L-14 -92 L-46 -46 L-18 -50 L-54 -8 L54 -8 L18 -50 L46 -46 L14 -92 L34 -90 Z"/>
    </g>
    <g transform="translate(736 516) scale(1.1)">
      <rect x="-3" y="-20" width="6" height="26"/>
      <path d="M0 -150 L-34 -90 L-14 -92 L-46 -46 L-18 -50 L-54 -8 L54 -8 L18 -50 L46 -46 L14 -92 L34 -90 Z"/>
    </g>
    <g transform="translate(548 512) scale(0.6)">
      <rect x="-3" y="-20" width="6" height="26"/>
      <path d="M0 -150 L-34 -90 L-14 -92 L-46 -46 L-18 -50 L-54 -8 L54 -8 L18 -50 L46 -46 L14 -92 L34 -90 Z"/>
    </g>
  </g>
  <!-- pine rim light -->
  <g fill="none" stroke="#ffcf94" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round">
    <path d="M578 500 L610 358 L586 396"/>
    <path d="M700 512 L736 351"/>
  </g>

  <!-- grass tufts -->
  <g stroke="#0d1024" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M30 560 q4 -22 -2 -34 M40 560 q2 -16 8 -26 M52 562 q-2 -14 -10 -22"/>
    <path d="M380 570 q4 -20 -2 -30 M392 570 q2 -14 8 -22 M404 572 q-2 -12 -10 -20"/>
    <path d="M740 575 q4 -22 -2 -32 M752 575 q2 -16 8 -26 M764 577 q-2 -14 -10 -22"/>
  </g>

  <!-- drifting golden particles -->
  <g fill="#ffe7a3">
    <circle cx="180" cy="380" r="2.6" opacity="0.8"/><circle cx="260" cy="440" r="2" opacity="0.7"/>
    <circle cx="500" cy="400" r="2.4" opacity="0.75"/><circle cx="560" cy="360" r="1.8" opacity="0.7"/>
    <circle cx="330" cy="470" r="2.2" opacity="0.8"/><circle cx="690" cy="420" r="2.6" opacity="0.7"/>
    <circle cx="90" cy="440" r="2" opacity="0.7"/><circle cx="450" cy="470" r="1.8" opacity="0.8"/>
  </g>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
