name: p11-apply
on:
  push:
    branches: [brand/placement-topik-icons]
    paths: [p11.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/placement-topik-icons
      - name: Apply patch
        run: |
          set -e
          git apply --unidiff-zero p11.patch
          git rm -q p11.patch
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A src
          git commit -m 'brand: Klovers icons and palette on the placement CTA and TOPIK page'
          git push
