
# The sanctioned way to apply migrations to production.
#
# `supabase db push` cannot be used against this project. 112 versions in the
# remote history have no local migration file - the hand-applied ones
# catalogued in docs/MIGRATION_TRIAGE.md - and db push refuses to run at all
# while that is true. The alternative it suggests, `migration repair --status
# reverted` on those versions, would delete the record of migrations that
# really were applied, so it is not used either.
#
# Instead this workflow applies each pending migration directly with psql and
# records it through the CLI's own writer immediately after, before moving to
# the next file - what db push would have done minus the consistency check it
# cannot satisfy. Apply-then-record happens per file, not as two passes over
# the whole batch, so a later file's failure can never leave an earlier
# file's already-committed change unrecorded.
#
# Three modes, dispatched by hand:
#   plan         (default)  list what would be applied, change nothing
#   apply                   apply them, record them, verify none remain
#   repair-only             record ONE already-verified-live version as
#                           applied - no psql, no schema touched at all.
#                           For exactly one situation: a migration whose
#                           effect is confirmed live on production by some
#                           means other than this workflow (direct SQL
#                           access, a manual apply_migration call, anything
#                           outside the git -> PR -> this-workflow path),
#                           found unrecorded in schema_migrations. That is a
#                           human judgment call, not something this workflow
#                           verifies for you - see the `repair` job below for
#                           exactly what it does and does not check. Needs
#                           the `version` input; leave it blank for the other
#                           two modes.
#
# Two jobs for plan/apply, not one, plus a third for repair-only. `plan` is read-only (migration list + a dry SQL preview
# in the step summary) and always runs so a reviewer has something to look
# at. `apply` is the only job that touches the database, and it runs under
# the `production-db-apply` GitHub Environment - if that environment has
# Required reviewers configured, the job pauses and waits for one of them to
# click Approve in the Actions UI before a single statement executes. Anyone
# who can dispatch this workflow can still make the *request*; only a
# required reviewer can make it actually run. If the environment does not
# exist yet, or has no reviewers configured, this gate does nothing - GitHub
# auto-creates an unprotected environment on first reference. Create it
# first (Settings -> Environments -> New environment -> name it exactly
# `production-db-apply` -> Required reviewers) for the gate to mean anything.
#
# Both `apply` and `repair-only` also require the `confirmation` input to
# match the `MIGRATION_APPLY_CONFIRMATION` environment secret on
# `production-db-apply`. This is a second, independent gate, not a
# replacement for Required reviewers: reviewers approve WHO can run the job;
# this catches the far more common accident of the WRONG dispatch - picking
# apply instead of plan, or the wrong version, without meaning to. The check
# is the first step in each job, before checkout or any database connection,
# so a mismatch stops the run having touched nothing at all. If the secret
# itself is unset, the job fails closed (refuses to run) rather than treating
# a blank input as a match. See docs/APPLYING_MIGRATIONS.md for how to set it.
#
# See docs/APPLYING_MIGRATIONS.md.

name: Apply Migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan lists what would be applied; apply actually applies it; repair-only records one version already verified live (needs the version input, touches no schema)"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - repair-only
      version:
        description: "repair-only mode only: the exact version to record (e.g. 20260829153926). You must have already verified its effect is live yourself - this job does not check that for you."
        required: false
        default: ""
        type: string
      confirmation:
        description: "Required for apply and repair-only: the exact phrase from the MIGRATION_APPLY_CONFIRMATION environment secret. Leave blank for plan mode."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Never let two runs touch the database at once.
concurrency:
  group: apply-migrations
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ewtdgpbybkceokfohhyg' }}

jobs:
  plan:
    name: ${{ inputs.mode == 'apply' && 'Plan (for review before apply)' || 'Plan (no changes)' }}
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@2.117.0 --version

      - name: Self-test the migration-list parser
        run: |
          set -euo pipefail
          # Runs before anything touches the database: if the parser cannot read
          # a known-good migration list, the pending list it produces below is
          # meaningless and the run should stop here.
          python3 scripts/test-migration-parser.py

      - name: Link project
        run: npx supabase@2.117.0 link --project-ref "$PROJECT_REF"

      - name: Work out what is pending
        id: plan
        run: |
          set -euo pipefail
          npx supabase@2.117.0 migration list | tee migration-list.txt

          local_migrations=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          echo "local migration files: ${local_migrations}"
          python3 scripts/parse-migration-list.py migration-list.txt \
            --min-rows "$local_migrations" | tee pending.txt

          count=$(grep -oP '(?<=^pending_count=)\d+' pending.txt)
          grep '^pending=' pending.txt | sed 's/^pending=//' | sort > pending-versions.txt || true
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "## Pending migrations: ${count}"
            echo
            echo '```'
            cat pending-versions.txt || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The filename list above says WHAT is pending, never WHAT IT DOES -
          # a reviewer approving an apply run had no way to see the SQL short of
          # someone pasting the file by hand. This reads the repo checkout the
          # job already has - no DB connection, so it changes nothing about
          # plan mode never touching the database - and prints each pending
          # file in full so the plan output is the review, not a pointer to one.
          if [ "$count" != "0" ]; then
            {
              echo
              echo "## Pending migration SQL"
            } >> "$GITHUB_STEP_SUMMARY"
            while read -r version; do
              [ -n "$version" ] || continue
              f=$(find supabase/migrations -maxdepth 1 -name "${version}_*.sql" | head -1)
              {
                echo
                echo "### ${f:-"(no local file found for ${version})"}"
                if [ -n "$f" ]; then
                  echo '```sql'
                  cat "$f"
                  echo '```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            done < pending-versions.txt
          fi

          echo "-----------------------------------------------------------"
          echo "Pending migrations: ${count}"
          cat pending-versions.txt || true
          echo "-----------------------------------------------------------"

      - name: Stop here (plan mode)
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          echo "Plan mode - nothing was applied."
          echo "Re-run with mode=apply to apply the ${{ steps.plan.outputs.count }} migration(s) listed above."

      - name: Stop here (repair-only mode)
        if: inputs.mode == 'repair-only'
        run: |
          set -euo pipefail
          echo "repair-only mode - this job only lists what git and the database currently disagree on."
          echo "It does not run the repair itself; see the repair job below for that, gated on the version input."

      - name: What happens next (apply mode)
        if: inputs.mode == 'apply' && steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          echo "This dispatch requested apply mode with ${{ steps.plan.outputs.count }} migration(s) pending."
          echo "The apply job now waits on the production-db-apply environment's required reviewers."
          echo "Nothing has been applied yet - check the job's Actions page for the Review deployments prompt."

  apply:
    name: Apply pending migrations
    needs: plan
    if: inputs.mode == 'apply' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    # This is the lock. A required reviewer on this environment must approve
    # the run before any step below executes - see the note at the top of
    # this file for what has to exist in repo Settings for that to be real.
    environment: production-db-apply
    steps:
      - name: Require explicit confirmation before touching production
        env:
          EXPECTED: ${{ secrets.MIGRATION_APPLY_CONFIRMATION }}
          GOT: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ]; then
            echo "::error::MIGRATION_APPLY_CONFIRMATION is not set on the production-db-apply environment. Refusing to run apply until it exists - see docs/APPLYING_MIGRATIONS.md."
            exit 1
          fi
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::confirmation input did not match. Nothing has been touched. Re-dispatch mode=apply with the correct phrase."
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@2.117.0 --version

      - name: Link project
        run: npx supabase@2.117.0 link --project-ref "$PROJECT_REF"

      - name: Re-confirm what is pending
        id: replan
        run: |
          set -euo pipefail
          # Re-derived now, on this job's own runner, against the database's
          # CURRENT state - not copied from the plan job. Approval can sit
          # for a while; re-reading here catches anything that changed what
          # was pending between the plan a reviewer looked at and this
          # actually running, rather than trusting a stale snapshot.
          npx supabase@2.117.0 migration list | tee migration-list.txt

          local_migrations=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          python3 scripts/parse-migration-list.py migration-list.txt \
            --min-rows "$local_migrations" | tee pending.txt

          count=$(grep -oP '(?<=^pending_count=)\d+' pending.txt)
          grep '^pending=' pending.txt | sed 's/^pending=//' | sort > pending-versions.txt || true
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending at apply time: ${count}"
          cat pending-versions.txt || true

          if [ "$count" = "0" ]; then
            echo "::notice::Nothing pending any more - the plan job's list was cleared by another apply run while this one waited for approval. Nothing to do."
          fi

      - name: Resolve the database connection
        if: steps.replan.outputs.count != '0'
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"

          # The direct host is IPv6-only for many projects and GitHub runners are
          # IPv4-only, so probe the IPv4 poolers first and fall back to direct.
          DBHOST=""; DBUSER=""
          for cand in \
            "aws-1-ap-south-1.pooler.supabase.com|postgres.$PROJECT_REF" \
            "aws-0-ap-south-1.pooler.supabase.com|postgres.$PROJECT_REF" \
            "db.$PROJECT_REF.supabase.co|postgres" ; do
            host="${cand%%|*}"; user="${cand##*|}"
            if psql -h "$host" -p 5432 -U "$user" -d postgres -tAc 'SELECT 1' >/dev/null 2>&1; then
              DBHOST="$host"; DBUSER="$user"; break
            fi
            echo "Could not connect via ${host} - trying next candidate."
          done
          if [ -z "$DBHOST" ]; then
            echo "::error::Could not reach the database on any candidate host. Nothing has been applied."
            exit 1
          fi
          echo "Connected via ${DBHOST}."
          echo "DBHOST=$DBHOST" >> "$GITHUB_ENV"
          echo "DBUSER=$DBUSER" >> "$GITHUB_ENV"

      - name: Apply and record the pending migrations, one at a time
        if: steps.replan.outputs.count != '0'
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"

          # Each file is applied AND recorded before moving to the next one.
          # This used to be two passes - apply every file, then record every
          # version in one batched `migration repair` call at the end. That
          # meant a file N+1 failure (or the job dying between the passes for
          # any other reason - cancellation, runner loss) left every already-
          # committed file 1..N applied on the live database but with no row
          # in schema_migrations - a migration that is real and unrecorded at
          # the same time, exactly the state 20260829153926 was found in.
          # Recording each version immediately after its own psql succeeds
          # closes that gap: whatever already committed to the database is
          # durably recorded before the next file's psql even starts, so a
          # later failure can never again leave a real, applied migration
          # without its row.
          while read -r version; do
            [ -n "$version" ] || continue
            f=$(find supabase/migrations -maxdepth 1 -name "${version}_*.sql" | head -1)
            if [ -z "$f" ]; then
              echo "::error::No local file found for pending version ${version}."
              exit 1
            fi
            echo "::group::apply $(basename "$f")"
            # A file that opens its own transaction manages it. Anything else is
            # wrapped in one, so a mid-file failure cannot leave a migration
            # half-applied. errexit aborts on the first failure, leaving later
            # migrations untouched.
            if grep -qiE '^[[:space:]]*BEGIN[[:space:]]*;' "$f"; then
              echo "(file manages its own transaction)"
              psql -h "$DBHOST" -p 5432 -U "$DBUSER" -d postgres \
                   -v ON_ERROR_STOP=1 -f "$f"
            else
              psql -h "$DBHOST" -p 5432 -U "$DBUSER" -d postgres \
                   -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            fi
            echo "applied: $(basename "$f")"

            # The CLI's own writer, so this row matches every other row in
            # supabase_migrations.schema_migrations rather than a hand-rolled
            # insert. Runs right here, not after the loop - see the note above.
            npx supabase@2.117.0 migration repair --status applied "$version"
            echo "recorded: ${version}"
            echo "::endgroup::"
          done < pending-versions.txt

      - name: Verify nothing is pending and print the state
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"

          npx supabase@2.117.0 migration list | tee migration-list-after.txt
          local_migrations=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          python3 scripts/parse-migration-list.py migration-list-after.txt \
            --min-rows "$local_migrations" | tee pending-after.txt

          remaining=$(grep -oP '(?<=^pending_count=)\d+' pending-after.txt)
          echo "Pending after apply: ${remaining}"
          if [ "$remaining" != "0" ]; then
            echo "::error::Expected 0 pending migrations after applying, found ${remaining}."
            grep '^pending=' pending-after.txt || true
            exit 1
          fi

          if [ -n "${DBHOST:-}" ]; then
            psql -h "$DBHOST" -p 5432 -U "$DBUSER" -d postgres -v ON_ERROR_STOP=1 <<'SQL' | tee verification.txt
          \pset border 2
          SELECT count(*) AS schema_migrations_rows,
                 max(version) AS latest_version
            FROM supabase_migrations.schema_migrations;
          SQL
            {
              echo "## Applied - migration history"
              echo
              echo '```'
              cat verification.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  repair:
    name: Record one version as already applied (no execution)
    if: inputs.mode == 'repair-only'
    runs-on: ubuntu-24.04
    # Same lock as apply. Marking a version "applied" when it was not is
    # just as dangerous as a bad apply - a later real migration could then
    # build on a foundation that was never actually laid - so this gets the
    # same required-reviewer gate, not a lighter one.
    environment: production-db-apply
    steps:
      - name: Require explicit confirmation before touching production
        env:
          EXPECTED: ${{ secrets.MIGRATION_APPLY_CONFIRMATION }}
          GOT: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ]; then
            echo "::error::MIGRATION_APPLY_CONFIRMATION is not set on the production-db-apply environment. Refusing to run repair-only until it exists - see docs/APPLYING_MIGRATIONS.md."
            exit 1
          fi
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::confirmation input did not match. Nothing has been touched. Re-dispatch mode=repair-only with the correct phrase."
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@2.117.0 --version

      - name: Validate the version input
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            echo "::error::mode=repair-only requires the version input (e.g. 20260829153926). Nothing done."
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]{14}$ ]]; then
            echo "::error::version '${version}' does not look like a 14-digit migration timestamp. Nothing done."
            exit 1
          fi
          f=$(find supabase/migrations -maxdepth 1 -name "${version}_*.sql" | head -1)
          if [ -z "$f" ]; then
            echo "::error::No local migration file found for version ${version}. This job only records versions that already have a reviewed file in the repo - it does not invent history."
            exit 1
          fi
          echo "Found local file: $(basename "$f")"

      - name: Link project
        run: npx supabase@2.117.0 link --project-ref "$PROJECT_REF"

      - name: Confirm this version is not already recorded
        run: |
          set -euo pipefail
          npx supabase@2.117.0 migration list | tee migration-list.txt
          # The CLI's table wraps every cell in backticks: `VERSION` | `VERSION` | `TIME`
          # (see scripts/parse-migration-list.py's docstring for the exact
          # format). A row is already-applied when the same version appears
          # backticked in both the Local and Remote columns.
          if grep -qE "\`${{ inputs.version }}\`[[:space:]]*[|│][[:space:]]*\`${{ inputs.version }}\`" migration-list.txt; then
            echo "::notice::${{ inputs.version }} already appears applied in schema_migrations - nothing to do. This is a safe no-op, not an error."
            echo "ALREADY_RECORDED=1" >> "$GITHUB_ENV"
          fi

      - name: Record the version
        if: env.ALREADY_RECORDED != '1'
        run: |
          set -euo pipefail
          # This is the ENTIRE action this job takes: one call to the CLI's
          # own writer, exactly what the apply job's "record" step runs for
          # a version it just applied itself. No psql connection is opened
          # anywhere in this job, no SQL of any kind runs against the
          # database - this cannot touch the schema even by accident.
          #
          # Whoever dispatched this run is asserting, on their own
          # authority, that this version's effect is already verified live
          # on production by some means outside this workflow. This job
          # takes that on trust - it has no way to independently confirm a
          # migration file's effect matches reality, only a human
          # comparing the file to the database can do that. Get that proof
          # BEFORE dispatching this, not after.
          npx supabase@2.117.0 migration repair --status applied "${{ inputs.version }}"
          echo "recorded: ${{ inputs.version }}"

      - name: Verify and print the state
        run: |
          set -euo pipefail
          npx supabase@2.117.0 migration list | tee migration-list-after.txt
          if ! grep -qE "\`${{ inputs.version }}\`[[:space:]]*[|│][[:space:]]*\`${{ inputs.version }}\`" migration-list-after.txt; then
            echo "::error::${{ inputs.version }} still does not show as applied after the repair call."
            exit 1
          fi
          {
            echo "## repair-only: ${{ inputs.version }}"
            echo
            echo "Now recorded as applied. No SQL was executed against the database in this job."
          } >> "$GITHUB_STEP_SUMMARY"
