# One-off cleanup: removes scripts/qa-patch from the QA branch. Deleted before merge.
name: QA patch (one-off)

on:
  push:
    branches:
      - fix/qa-remaining-2026-09-25
    paths:
      - scripts/qa-patch/trigger.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/qa-remaining-2026-09-25
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -r -q scripts/qa-patch
          git commit -m "Remove one-off QA patch helper"
          git push
