# One-off: applies scripts/qa-patch/patches.json on the QA fix branch, builds
# and tests the result, and commits it back. Deleted before merge.
name: QA patch (one-off)

on:
  push:
    branches:
      - fix/qa-2026-09-25-priority
    paths:
      - scripts/qa-patch/patches.json

permissions:
  contents: write

concurrency:
  group: qa-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/qa-2026-09-25-priority

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply patches
        id: apply
        run: node scripts/qa-patch/apply.mjs
        continue-on-error: true

      - name: Install
        if: steps.apply.outcome == 'success'
        run: npm ci --no-audit --no-fund

      - name: Build
        id: build
        if: steps.apply.outcome == 'success'
        run: npm run build > /tmp/build.log 2>&1
        continue-on-error: true

      - name: Test
        id: test
        if: steps.apply.outcome == 'success'
        run: npm test > /tmp/test.log 2>&1
        continue-on-error: true

      - name: SEO check
        id: seo
        if: steps.build.outcome == 'success'
        run: npm run seo:check > /tmp/seo.log 2>&1
        continue-on-error: true

      - name: Typecheck (advisory)
        if: steps.apply.outcome == 'success'
        run: npx tsc --noEmit -p tsconfig.app.json > /tmp/tsc.log 2>&1 || true

      - name: Write report and commit
        run: |
          set -e
          R=scripts/qa-patch/REPORT.md
          {
            echo
            echo "apply: ${{ steps.apply.outcome }} · build: ${{ steps.build.outcome }} · test: ${{ steps.test.outcome }} · seo: ${{ steps.seo.outcome }}"
            for f in build test seo tsc; do
              if [ -f /tmp/$f.log ]; then
                echo; echo "## $f (last 80 lines)"; echo '```'; tail -n 80 /tmp/$f.log; echo '```'
              fi
            done
          } >> $R
          cp $R /tmp/REPORT.md
          if [ "${{ steps.apply.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then
            git checkout -- .
            git clean -fd -e node_modules
            cp /tmp/REPORT.md $R
          else
            echo "[]" > scripts/qa-patch/patches.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!node_modules' ':!dist'
          git commit -m "QA patch run: apply=${{ steps.apply.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}" || echo "nothing to commit"
          git push
