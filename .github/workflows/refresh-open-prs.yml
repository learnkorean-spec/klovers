# ci.yml only re-runs on a PR event (opened/synchronize/reopened/
# ready_for_review) or a push to main - never on a PR's base branch simply
# moving. That means an open PR's green checkmark can describe a merge
# result that no longer matches main: main advanced after the PR's last
# real CI run, and nothing forces a fresh one. Recomputing the PR's
# mergeable_state via the API does not trigger CI either - only an actual
# new commit on the PR branch does (documented the hard way in CLAUDE.md,
# under "Merge safety net").
#
# This closes that gap the same way a person would: when main moves, merge
# it into every open PR's branch and push. A plain (non-force) push, so it
# never rewrites anyone's history - just adds a merge commit, which is
# exactly what GitHub's own "Update branch" button does.
#
# The push's `synchronize` event alone is NOT enough to get ci.yml to
# actually run, and this was found the hard way on this workflow's own
# first real run: every resulting ci.yml run landed as "action_required"
# with zero jobs executed. Cause - a documented GitHub Actions gotcha, not
# a bug in ci.yml itself: a push made with the default GITHUB_TOKEN is
# attributed to the github-actions[bot] identity, and GitHub's
# approval-required-for-outside-contributors gate catches that identity
# even on a same-repo push, exactly as if it were a fork PR from a
# first-time contributor. So this workflow does not rely on synchronize at
# all - after a successful push it explicitly dispatches ci.yml via
# workflow_dispatch (which ci.yml already supports) against the branch's
# new head. workflow_dispatch is a direct, explicit API call, not an
# inferred consequence of a push, so it is not subject to that same gate.
#
# A PR whose merge conflicts is left alone - conflicts get resolved by a
# person (or an agent) reading the actual clash, not by anything automatic
# here. No comment is posted for that case: PR-activity subscriptions
# already surface merge-conflict state through their own notification path.

# COST CONTROL, added 2026-08-31 after measuring the damage.
#
# This workflow pushed one commit per open PR on every push to main, and each
# of those pushes created a Vercel preview deployment. Measured that day: 90
# commits pushed, 68 of them from here. The Hobby plan allows 100 deployments
# per day and builds ONE at a time, so a single merge to main queued ~15
# preview builds AND the production deploy behind them - the deploy that
# actually reaches students waited on previews of documentation PRs.
#
# Two independent brakes now, because they fail differently:
#   1. Here: only refresh PRs that can actually be affected - skip drafts and
#      skip PRs whose diff is documentation only. That reduces deployments
#      CREATED, which is what the 100/day limit counts.
#   2. scripts/vercel-ignore-build.sh (wired via ignoreCommand in
#      vercel.json): even when a refresh commit is pushed, Vercel does not
#      build it. That frees the single concurrent build slot, which is what
#      was actually delaying production.
#
# Neither weakens the guarantee this workflow exists for. A draft PR is not
# merging yet, and marking it ready fires ci.yml against the current merge
# result anyway (pull_request: ready_for_review) - so it is covered at exactly
# the moment its CI starts to matter. A documentation-only PR cannot break the
# build or collide on a migration version.

name: Refresh open PRs against main

on:
  push:
    branches:
      - main

# main moved 18 times on 2026-08-31. Without this, overlapping runs each push
# their own merge commit to the same branches and multiply the deployments
# again.
concurrency:
  group: refresh-open-prs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  refresh:
    name: Merge main into every open PR branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge main into each open PR that is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # isDraft comes along so we can skip drafts without a second API call.
          prs=$(gh pr list --state open --json number,headRefName,isDraft \
            --jq '.[] | "\(.number)\t\(.headRefName)\t\(.isDraft)"')
          if [ -z "$prs" ]; then
            echo "No open PRs."
            exit 0
          fi

          echo "## Refresh open PRs against main" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r number branch isdraft; do
            [ -n "$branch" ] || continue
            echo "::group::PR #${number} (${branch})"

            if [ "$isdraft" = "true" ]; then
              echo "Draft - skipped. Marking it ready fires ci.yml against the"
              echo "current merge result, so nothing is lost by waiting."
              echo "- #${number} (${branch}): draft, skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            git fetch origin "$branch" -q

            # A PR that only touches documentation cannot break the build and
            # cannot collide on a migration version, so refreshing it buys
            # nothing and costs a deployment.
            changed=$(git diff --name-only "origin/main...origin/$branch")
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '(^docs/|\.md$)'; then
              echo "Documentation only - skipped. Files:"
              echo "$changed" | sed 's/^/  /'
              echo "- #${number} (${branch}): docs-only, skipped" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            git checkout -q -B "$branch" "origin/$branch"

            if git merge --no-edit -q origin/main; then
              if git diff --quiet "origin/$branch" HEAD; then
                echo "Already up to date with main - nothing to push."
                echo "- #${number} (${branch}): already up to date" >> "$GITHUB_STEP_SUMMARY"
              else
                git push origin "$branch"
                # The push's own synchronize event lands as action_required and
                # never runs (see the file header) - dispatch directly instead.
                gh workflow run ci.yml --ref "$branch"
                echo "Pushed merge commit and dispatched ci.yml directly."
                echo "- #${number} (${branch}): merged main, pushed, ci.yml dispatched" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              git merge --abort || true
              echo "Merge conflict - left untouched for manual resolution."
              echo "- #${number} (${branch}): merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done <<< "$prs"
