name: msa-fix
on:
  push:
    branches: [brand/msa-translations-hangul-book]
    paths: [msa_fix.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/msa-translations-hangul-book
      - name: Apply
        run: |
          set -e
          python3 msa_fix.py
          git rm -q msa_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A src
          git commit -m 'brand: one MSA tone in translations.ts and the Hangul web book; no emoji in their text'
          git push
