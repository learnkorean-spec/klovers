name: Deploy Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Kill switch. While supabase/MIGRATIONS_HOLD exists, both jobs below are
  # skipped. This guards every entry point at once - push to main, manual
  # dispatch, and the explicit dispatch auto-merge.yml makes after it merges a
  # PR - which removing that dispatch alone would not do.
  guard:
    name: Check migration hold
    runs-on: ubuntu-latest
    outputs:
      held: ${{ steps.check.outputs.held }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Look for the hold file
        id: check
        run: |
          set -euo pipefail
          if [ -f supabase/MIGRATIONS_HOLD ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/MIGRATIONS_HOLD is present - skipping migrations and edge function deploy."
            sed 's/^/    /' supabase/MIGRATIONS_HOLD
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "No hold file; proceeding."
          fi

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.held != 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@latest --version

      - name: Link project
        run: npx supabase@latest link --project-ref $SUPABASE_PROJECT_REF

      - name: Push schema migrations
        run: npx supabase@latest db push

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrate
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@latest --version

      - name: Deploy all edge functions
        run: npx supabase@latest functions deploy --project-ref $SUPABASE_PROJECT_REF
