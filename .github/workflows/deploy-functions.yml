name: Deploy Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Kill switch. While supabase/MIGRATIONS_HOLD exists, both jobs below are
  # skipped. This guards every entry point at once - push to main, manual
  # dispatch, and the explicit dispatch auto-merge.yml makes after it merges a
  # PR - which removing that dispatch alone would not do.
  guard:
    name: Check migration hold
    runs-on: ubuntu-latest
    outputs:
      held: ${{ steps.check.outputs.held }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Look for the hold file
        id: check
        run: |
          set -euo pipefail
          if [ -f supabase/MIGRATIONS_HOLD ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/MIGRATIONS_HOLD is present - skipping migrations and edge function deploy."
            sed 's/^/    /' supabase/MIGRATIONS_HOLD
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "No hold file; proceeding."
          fi

  # Reports whether the repo has migrations the database has not got, and fails
  # if it does. It deliberately does NOT apply them.
  #
  # `supabase db push` cannot run against this project: 112 versions in the
  # remote history have no local migration file - the hand-applied ones
  # catalogued in docs/MIGRATION_TRIAGE.md - and push refuses outright in that
  # state. Applying migrations is therefore a deliberate, manually dispatched
  # act: see .github/workflows/apply-migrations.yml and
  # docs/APPLYING_MIGRATIONS.md.
  #
  # Green means the repo and the database agree. Red means someone added a
  # migration file that has not been applied, and the message says what to do.
  migrate:
    name: Check migration state
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.held != 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@2.117.0 --version

      - name: Self-test the migration-list parser
        run: |
          set -euo pipefail
          python3 scripts/test-migration-parser.py

      - name: Link project
        run: npx supabase@2.117.0 link --project-ref $SUPABASE_PROJECT_REF

      - name: Assert no migrations are pending
        run: |
          set -euo pipefail
          npx supabase@2.117.0 migration list | tee migration-list.txt

          # Every local migration file must appear in the list, so the parser is
          # told how many to expect: a short parse means the output format moved
          # and the count cannot be trusted.
          local_migrations=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          echo "local migration files: ${local_migrations}"
          python3 scripts/parse-migration-list.py migration-list.txt \
            --min-rows "$local_migrations" | tee pending.txt

          pending=$(grep -oP '(?<=^pending_count=)\d+' pending.txt)
          if [ "$pending" != "0" ]; then
            {
              echo "## Migrations pending"
              echo
              echo "${pending} migration(s) exist in supabase/migrations but have not"
              echo "been applied to the database. This job does not apply them."
              echo
              echo '```'
              grep '^pending=' pending.txt || true
              echo '```'
              echo
              echo "Apply them with the Apply Migrations workflow (Actions ->"
              echo "Apply Migrations -> Run workflow), or see docs/APPLYING_MIGRATIONS.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${pending} migration(s) pending and NOT applied. Run the Apply Migrations workflow - see docs/APPLYING_MIGRATIONS.md."
            grep '^pending=' pending.txt || true
            exit 1
          fi
          echo "No migrations pending - the repo and the database agree."

  # Independent of the migration check. A migration question must not be able to
  # block shipping edge functions again: that coupling kept four months of
  # function work undeployed behind a failing db push. `needs: guard` and the
  # `if` below are what keep the hold file working for this job - they used to
  # be inherited through `needs: migrate`.
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.held != 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npx supabase@2.117.0 --version

      # BLOCKING, and the last gate before a live overwrite.
      #
      # This workflow's job is to replace the live functions with the repo's
      # copies, unconditionally. That is correct when the two agree and silent
      # data loss when they do not - on 26 Sep 2026 a corrected attendance
      # letter (v3) was applied by editing the function in the Supabase
      # dashboard, so production ran v3 while this repo still held v2. The next
      # push to main would have replaced the fix with the older copy, and
      # nothing in the pipeline would have said so.
      #
      # So before deploying, download what is actually live and compare it to
      # this commit. `--use-api` unbundles server-side, so no Docker is needed.
      # This is the edge-function counterpart of the migration check above: that
      # one asserts the repo has nothing the database has not seen, this one
      # asserts the repo has no function the dashboard has moved ahead of.
      #
      # The daily Edge Function Drift Check workflow (schedule 07:00 UTC) runs
      # the same comparison for reporting. It cannot gate this one - separate
      # workflows do not depend on each other - which is why it is repeated here
      # rather than reused.
      # 26 Sep 2026 (evening) - three defects fixed in the gate above's first
      # version, each of which alone stopped every function deploy:
      #   1. `functions download --workdir deployed` writes to
      #      deployed/supabase/functions/<name>/, not deployed/functions/<name>/,
      #      so nothing was ever found, "compared 0" fired, and ALL deploys failed.
      #   2. "differs from the repo" is true of every intentional change, so a
      #      working gate would have held back every function anyone edited.
      #      Out-of-band means: the live copy matches NO version this repo has
      #      ever had. Matching an older repo version is a normal pending update.
      #   3. The hold-aside ran in its own step with `trap restore EXIT`, so the
      #      held functions were put back before the deploy step and deployed
      #      anyway. Hold, deploy and restore now happen in one step.
      - name: Deploy edge functions, holding back any edited outside this repo
        run: |
          set -euo pipefail

          mkdir -p deployed
          npx supabase@2.117.0 functions download --use-api \
            --project-ref "$SUPABASE_PROJECT_REF" --workdir deployed

          norm() { tr -d '\r' | sed -e 's/[[:space:]]*$//'; }

          # The live copy of <name>, wherever this CLI version put it.
          live_file() {
            for c in "deployed/supabase/functions/$1/index.ts" "deployed/functions/$1/index.ts"; do
              [ -f "$c" ] && { echo "$c"; return 0; }
            done
            f=$(find deployed -path "*/functions/$1/index.ts" -print -quit 2>/dev/null || true)
            [ -n "$f" ] && echo "$f"
            return 0
          }

          compared=0
          held=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            repo_file="${dir}index.ts"
            [ -f "$repo_file" ] || continue

            live=$(live_file "$name")
            if [ -z "$live" ]; then
              # Never deployed (or not downloadable): nothing live to protect.
              echo "New or not downloadable: $name - deploying."
              continue
            fi
            compared=$((compared + 1))

            live_n=$(norm < "$live")
            [ "$live_n" = "$(norm < "$repo_file")" ] && continue

            # Differs from this commit. Is it an older copy of this repo's file?
            known=0
            for sha in $(git log --format=%H -n 300 -- "$repo_file"); do
              if [ "$live_n" = "$(git show "$sha:$repo_file" 2>/dev/null | norm)" ]; then
                known=1; break
              fi
            done
            [ "$known" = "1" ] && continue

            held="$held $name"
            echo "::warning::Function '${name}' was edited outside this repo - holding it back."
            {
              echo "### ${name} - live copy matches no version in this repo"
              echo
              echo '```diff'
              diff -u <(norm < "$live") <(norm < "$repo_file") \
                --label "live/${name}" --label "repo/${name}" | head -60 || true
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$compared" -eq 0 ]; then
            echo "::error::Compared 0 functions - the download produced nothing comparable. Refusing to deploy."
            echo "## Deploy blocked: the live copies could not be read" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$held" ]; then
            {
              echo "## Held back: $(echo $held | wc -w) function(s) edited outside this repo"
              for n in $held; do echo "- \`${n}\`"; done
              echo
              echo 'Bring the repo to match the live copy, or redeploy deliberately.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          hold_dir="$(mktemp -d)"
          restore() {
            for n in $held; do
              if [ -d "$hold_dir/$n" ]; then
                rm -rf "supabase/functions/$n"
                mv "$hold_dir/$n" "supabase/functions/$n"
              fi
            done
          }
          trap restore EXIT
          for n in $held; do
            if [ -d "supabase/functions/$n" ]; then mv "supabase/functions/$n" "$hold_dir/$n"; fi
          done

          echo "Compared $compared live functions; holding back:${held:- none}"
          npx supabase@2.117.0 functions deploy --project-ref "$SUPABASE_PROJECT_REF"
