name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # v5 — v4 targets Node 20, which GitHub has deprecated and is already
      # force-running on Node 24. Currently a warning; will become a failure.
      - name: Checkout repo
        uses: actions/checkout@v5

      # BLOCKING. Two sessions can each pick a migration filename timestamp
      # with zero visibility into what the other picked - this is exactly
      # what happened on 27 Aug 2026: two independent PRs both introduced
      # a file named 20260827140000_*.sql. One merged first; from that
      # point on, Apply Migrations matches pending files by version PREFIX
      # only (`find supabase/migrations -name "${version}_*.sql"`), so once
      # that prefix was recorded as applied, the second PR's migration could
      # never run under that number again - it would silently stay
      # "pending" forever while looking identical to every other pending
      # file, or (worse) get marked applied without its own SQL ever having
      # executed if a later run happened to match on the prefix. Nothing in
      # the pipeline raised a warning. A direct database check caught it, by
      # someone thinking to run one - not by anything mechanical. This step
      # is what should have caught it, before merge, not after.
      - name: Check for colliding migration version numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Only a `.sql` file is a migration. `find supabase/migrations -name
          # "${version}_*.sql"` is how Apply Migrations resolves a version, so
          # 20260830900000_drop_xp_leaderboard_view.sql.PENDING is invisible to
          # it and must be invisible here too - counting it would fail the
          # build over a collision that cannot happen.
          all_versions() {
            git ls-tree "$1" -- supabase/migrations/ --name-only \
              | xargs -r -n1 basename 2>/dev/null \
              | sed -nE 's/^([0-9]{14})_.*\.sql$/\1/p'
          }

          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            # Push to main, or a manual dispatch. There is no PR diff to take,
            # but the whole directory can still be checked - and it MUST be.
            #
            # On 14 Sep 2026 two files on main both claimed 20260914190000
            # (confirm_letter_on_choice and schedule_packages_class_language).
            # Each had come from its own PR and each was green at the time;
            # the collision was created by main moving underneath them, and no
            # pull_request event ever fired to look at the result. This branch
            # used to `exit 0` here, so the one event that WAS in a position to
            # see it - the push to main - deliberately looked away. The next
            # Apply Migrations run would have applied one file, recorded the
            # version as done, and left the other unrunnable forever.
            echo "Not a pull_request event - checking the whole migrations directory instead."
            dups=$(all_versions HEAD | sort | uniq -d)
            if [ -n "$dups" ]; then
              for v in $dups; do
                files=$(git ls-tree HEAD -- supabase/migrations/ --name-only \
                  | grep -E "/${v}_.*\.sql$" | tr '\n' ' ')
                echo "::error::Migration version $v is used by more than one file: ${files}. Apply Migrations takes only the first and records the version as applied, so the rest would never run. Rename all but one."
              done
              exit 1
            fi
            echo "No duplicate migration version numbers on this ref."
            exit 0
          fi

          git fetch origin "$BASE" --depth=1 -q
          git fetch origin "$HEAD" --depth=1 -q

          # This PR's own new migration version numbers (added files only -
          # renaming or editing an existing one isn't a collision risk here).
          mine=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" -- supabase/migrations/ \
            | xargs -r -n1 basename 2>/dev/null \
            | sed -nE 's/^([0-9]{14})_.*\.sql$/\1/p' \
            | sort -u)

          if [ -z "$mine" ]; then
            echo "No new migration files in this PR - nothing to check."
            exit 0
          fi
          echo "This PR introduces migration version(s):"
          echo "$mine"

          # 1. Already on main right now - catches "a different PR merged
          #    the same number while this one was open," which is exactly
          #    what happened on 27 Aug.
          git fetch origin main -q
          main_versions=$(all_versions origin/main | sort -u)

          collision=0
          for v in $mine; do
            if echo "$main_versions" | grep -qx "$v"; then
              echo "::error::Migration version $v already exists on main (a different PR merged it first). Rename this file to a new, unused timestamp."
              collision=1
            fi
          done

          # 2. Every other currently-open PR - catches the collision before
          #    EITHER side merges, not just after one already has.
          echo "Checking other open PRs for the same version number..."
          other_branches=$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName != "${{ github.head_ref }}") | .headRefName' || true)
          for branch in $other_branches; do
            git fetch origin "$branch" -q 2>/dev/null || continue
            other_versions=$(all_versions "origin/$branch" 2>/dev/null)
            for v in $mine; do
              if echo "$other_versions" | grep -qx "$v"; then
                echo "::error::Migration version $v is also used on branch '$branch' (another open PR). Whichever merges second will silently never run under that number - coordinate, or rename to a new timestamp now."
                collision=1
              fi
            done
          done

          if [ "$collision" -eq 1 ]; then
            echo "::error::Colliding migration version number(s) found - see errors above. This PR cannot merge safely until every listed version is renamed to something unused."
            exit 1
          fi
          echo "No collisions found."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The edge functions are Deno, not Vite - nothing else in this file
      # touches them, and `supabase functions deploy` runs on every push to main
      # with no typecheck of its own. Advisory first, same as the app's
      # `tsc --noEmit` below: 16 of 69 functions fail today and paying that
      # down is its own piece of work. Set continue-on-error to false once the
      # baseline in scripts/edge-functions-baseline.json is empty.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: No new edge-function type errors
        run: node scripts/check-edge-functions.mjs
        continue-on-error: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      # This is the step that matters most. On a pull_request event the
      # checkout above is the MERGE of the PR into main, not the PR branch,
      # so this compiles the actual post-merge tree. That is what caught
      # PR #36: git merged it cleanly, but the result had duplicate
      # slotMatch / sessionLanguage declarations because main already had
      # the feature.
      - name: Build
        run: npm run build

      # BLOCKING. Asserts the SEO invariants A1 guarantees against the freshly
      # built dist/: every route has a title, no route reuses the homepage
      # title, every canonical is self-referencing and unique, and robots.txt
      # names exactly one sitemap. A regression here silently de-ranks pages,
      # which is exactly the class of bug that goes unnoticed for months.
      - name: SEO check
        run: npm run seo:check

      # BLOCKING, as a ratchet rather than a cleanup. Three production bugs
      # shared one mechanism: a Supabase query destructured `data` and never
      # read `error`, so a rejected request became `data === null`, a falsy
      # guard swallowed it, and the UI showed an empty state instead of a
      # failure. The weekly leaderboard tab (selecting a column that does not
      # exist) and the community feed (same) were both dead for months with
      # nothing in the console.
      #
      # src/ has 205 of these today. Fixing them all at once would be an
      # unreviewable diff, so scripts/supabase-errors-baseline.json records the
      # per-file count and this fails only when a file gains more. The number
      # can go down and never up. Pay one down, rerun with --update, commit.
      - name: No new unchecked Supabase errors
        run: node scripts/check-supabase-errors.mjs

      # Advisory only: the codebase currently has 22 pre-existing eslint errors
      # and ~579 warnings, so this must not block merges yet. Remove
      # continue-on-error once those are cleaned up to make lint a hard gate.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # Advisory only: ~10 files have pre-existing type errors (stale generated
      # Supabase types, a too-narrow LeadSource union). Vite does not typecheck
      # at build time, which is why production has been fine regardless. Shown
      # here for visibility; promote to blocking once the backlog is cleared.
      - name: Typecheck (advisory)
        run: npx tsc --noEmit -p tsconfig.app.json
        continue-on-error: true
