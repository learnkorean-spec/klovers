name: rm-book
on:
  push:
    branches: [chore/remove-old-hangul-book]
    paths: [rm_book.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-old-hangul-book
      - name: Apply
        run: |
          set -e
          python3 rm_book.py
          git rm -q src/pages/HangulBookPage.tsx rm_book.py
          if grep -rn 'pages/HangulBookPage' src; then echo 'still imported'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A src
          git commit -m 'chore: remove the old /hangul-book web book; old links go to the dashboard (My Books)'
          git push
