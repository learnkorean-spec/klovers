name: p9-apply
on:
  push:
    branches: [fix/p9-klover-icons]
    paths: [p9.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p9-klover-icons
      - name: Apply patch
        run: |
          set -e
          git apply --unidiff-zero p9.patch
          sed -i 's|<BookOpen className="w-4 h-4" /> ||g' src/pages/VocabularyReviewPage.tsx
          if grep -n 'BookOpen\|ChevronRight' src/pages/VocabularyReviewPage.tsx src/components/EggTeaser.tsx; then echo leftover; exit 1; fi
          git rm -q p9.patch
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A src
          git commit -m 'fix(brand): Klovers icons on vocabulary review and egg teaser; check lesson query error; Arabic lesson filter'
          git push
