name: SEO check (production)

# Verifies the live site the way a search engine sees it: plain HTTP, no
# JavaScript. This exists because the SEO invariants A1 guarantees can only be
# fully checked against a real deployment - dist/ mode in ci.yml catches
# regressions before merge, this catches anything that only shows up in
# production (a bad rewrite, an expired env var, a sitemap that stops building).

on:
  # Manual "Run workflow" button on the Actions tab.
  workflow_dispatch:
  # Every Monday at 06:00 UTC. Scheduled runs only fire from the default
  # branch, so this starts working once the workflow is merged to main.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# One production check at a time; a queued run waits rather than overlapping.
concurrency:
  group: seo-check-prod
  cancel-in-progress: false

jobs:
  seo-check:
    name: Check kloversegy.com
    runs-on: ubuntu-latest
    env:
      SITE: https://kloversegy.com
      # An Arabic post. Arabic slugs are not <loc> entries in the sitemap by
      # design - they appear as xhtml:link hreflang="ar" alternates. This one is
      # the declared Arabic partner of /blog/korean-numbers-guide below, so the
      # two lines in the report can be read against each other.
      AR_POST: /blog/korean-numbers-guide-ar
      # A retired Arabic duplicate. PR #87 removed the legacy `ar-` prefixed
      # posts from the sitemap as confirmed duplicates, so this slug must stay
      # out of the sitemap while remaining reachable. Checking it by name keeps
      # the retirement itself covered rather than assumed.
      RETIRED_POST: /blog/ar-korean-numbers-guide
      # Coverage floor for the live run. The page list comes from the production
      # sitemap, so this is the number that makes a silent shrink loud. Lower it
      # deliberately, in the same change that shrinks the catalogue.
      MIN_PAGES: "200"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
        # No npm install: scripts/seo-check.mjs uses only Node built-ins (fs,
        # path) and global fetch. Skipping the install keeps this job at a few
        # seconds and immune to dependency breakage.

      - name: Prepare report directory
        run: mkdir -p seo-report

      # continue-on-error so the diagnostics below still run and upload when
      # this fails - a failed check is exactly when you want the curl output.
      # The job is failed deliberately in the last step.
      - name: Run seo-check against production
        id: seocheck
        continue-on-error: true
        run: |
          node scripts/seo-check.mjs --base "$SITE" --min-pages "$MIN_PAGES" 2>&1 | tee seo-report/seo-check.txt

      - name: Fetch key pages without JavaScript
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          check() {
            url="${SITE}$1"
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 "$url" 2>/dev/null || echo 000)"
            location="$(curl -sS -o /dev/null -D - --max-time 30 "$url" 2>/dev/null | grep -i '^location:' | head -1 | tr -d '\r' || true)"

            title="$(grep -o '<title>[^<]*</title>' "$body" | head -1 | sed -e 's|<title>||' -e 's|</title>||' || true)"
            canonical="$(grep -o 'rel="canonical" href="[^"]*"' "$body" | head -1 | sed -e 's|.*href="||' -e 's|"$||' || true)"
            robots="$(grep -o 'name="robots" content="[^"]*"' "$body" | head -1 | sed -e 's|.*content="||' -e 's|"$||' || true)"

            echo "── ${url}"
            echo "   HTTP status : ${status}"
            [ -n "$location" ] && echo "   ${location}"
            echo "   title       : ${title:-(none)}"
            echo "   canonical   : ${canonical:-(none)}"
            echo "   robots meta : ${robots:-(none)}"
            echo
            rm -f "$body"
          }

          {
            echo "Plain-HTTP checks (no JavaScript executed)"
            echo "Run at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            check "/blog/korean-conditional-sentences-guide"
            check "/blog/korean-numbers-guide"
            check "$AR_POST"
            check "$RETIRED_POST"
            check "/blog/this-slug-does-not-exist"
            check "/this-page-does-not-exist"
            check "/login"
            echo "Note: ${RETIRED_POST} is a retired Arabic duplicate, redirected"
            echo "to its surviving 2025 partner by PR #85. A 308 with a location"
            echo "header is the expected result, and it must not appear in the"
            echo "sitemap. A 200 here would mean the redirect had been lost."
            echo
            echo "Note: /blog/this-slug-does-not-exist returning 404 is the expected"
            echo "result (PR #132, 2026-08-29) - this line is the regression check for"
            echo "that fix. A 200 here would mean the /blog/:slug rewrite broke."
            echo
            echo "Note: /this-page-does-not-exist returning 200 is still expected."
            echo "PR #132 (2026-08-29) fixed this for /blog/:slug specifically -"
            echo "api/blog-not-found.js, checked above - via Vercel serving a matching"
            echo "static file before it ever evaluates rewrites, which only /blog/:slug"
            echo "can rely on (every valid slug has a prerendered file; a missing one is"
            echo "always invalid). No other route has that property, so a top-level path"
            echo "like this one still falls through to the generic SPA shell with a 200."
            echo "Known limitation until Option B (see docs/SEO_MIGRATION.md)."
          } 2>&1 | tee seo-report/curl-checks.txt

      # Puts both reports on the run's summary page, so they can be read without
      # opening the raw log.
      - name: Publish to run summary
        if: always()
        run: |
          {
            echo "## seo-check — production"
            echo
            echo '```'
            cat seo-report/seo-check.txt 2>/dev/null || echo "(seo-check produced no output)"
            echo '```'
            echo
            echo "## Key pages, fetched without JavaScript"
            echo
            echo '```'
            cat seo-report/curl-checks.txt 2>/dev/null || echo "(no curl output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-check-production
          path: seo-report/
          retention-days: 30

      # The gate. Kept last so the report is always produced and uploaded first.
      - name: Fail if seo-check failed
        if: steps.seocheck.outcome == 'failure'
        run: |
          echo "::error::seo-check failed against ${SITE}. See the run summary or the seo-check-production artifact."
          exit 1

  lighthouse:
    name: Core Web Vitals (Lighthouse)
    runs-on: ubuntu-latest
    # Independent of the seo-check job above: neither depends on the other,
    # and a Lighthouse failure never fails this workflow (see the note on
    # scripts/lighthouse-budget.mjs below). Its own job so the fast,
    # dependency-free seo-check job above keeps that property - Lighthouse
    # needs npx to fetch a real package and a real Chrome, seo-check
    # deliberately doesn't.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Reported, not gated. This is the first time Core Web Vitals have
      # ever been measured for this site (open since the August diagnosis) -
      # there is no baseline yet to set a pass/fail threshold against.
      # continue-on-error so a Lighthouse hiccup (a flaky Chrome launch, a
      # slow cold page) never fails the workflow or blocks seo-check's own
      # report; the numbers just show up as "-" for whichever page failed.
      - name: Run Lighthouse against production
        id: lighthouse
        continue-on-error: true
        env:
          SITE: https://kloversegy.com
        run: |
          node scripts/lighthouse-budget.mjs "$SITE" | tee lighthouse-report.md

      - name: Publish to run summary
        if: always()
        run: |
          {
            echo "## Core Web Vitals — production (Lighthouse, mobile, lab data)"
            echo
            echo "Reported metric, not a gate yet — no baseline exists to set a"
            echo "threshold against. A threshold gets proposed once these numbers"
            echo "have run for a few weeks. See docs/DECISIONS.md."
            echo
            cat lighthouse-report.md 2>/dev/null || echo "(Lighthouse produced no output — see the job log)"
            echo
            echo "TBT (Total Blocking Time) is a lab proxy for interactivity, not"
            echo "real INP — a single cold-navigation Lighthouse run has no user"
            echo "interaction to measure, so it cannot produce field INP. Real INP"
            echo "needs either CrUX field data (via PageSpeed Insights, once this"
            echo "site has enough real traffic to populate it) or a scripted"
            echo "Lighthouse user-flow, neither of which this job does."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-budget
          path: lighthouse-report.md
          retention-days: 30
