    <!--
      Crawler-only prerendered body (25 Sep 2026). scripts/prerender-meta.mjs
      writes plain HTML into #root for non-JS crawlers (#home-prerendered,
      #article-prerendered, #era-prerendered ...). Unstyled, it flashed on
      every reload as a raw text page before React replaced it (Re: "a text
      code picture before loading"). It stays in the HTML - crawlers and
      screen readers still read it - but is visually hidden. React's first
      render replaces #root's children, so this never affects the real page.
      Inline and in <head> on purpose: it must apply before any CSS file loads.
    -->
    <style>
      #root > [id$="-prerendered"] {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <!--
      No JavaScript at all (4 Oct 2026).

      The rule above is what stops the prerendered body flashing as raw text
      before React replaces it (see the note above it). With scripting switched
      off nothing ever replaces it - so the same rule also made a no-JS visit a
      completely blank ivory page, with the content sitting in the document and
      unreadable.

      This override lives in <noscript>, so it applies only to a browser that
      is not going to run the app; the styled page is untouched. It restores
      normal flow and a readable measure instead of the 1px clip, and gives the
      plain HTML enough typography to be worth reading - the stylesheet that
      would normally do that is loaded by the app.
    -->
    <noscript>
      <style>
        #root > [id$="-prerendered"] {
          position: static !important;
          width: auto !important;
          height: auto !important;
          margin: 0 auto !important;
          padding: 2rem 1.25rem 4rem !important;
          overflow: visible !important;
          clip: auto !important;
          white-space: normal !important;
          max-width: 44rem;
          line-height: 1.7;
        }
        #root > [id$="-prerendered"] h1 {
          font-size: 1.75rem;
          line-height: 1.25;
          margin: 0 0 1rem;
        }
        #root > [id$="-prerendered"] h2 {
          font-size: 1.25rem;
          line-height: 1.3;
          margin: 2rem 0 0.5rem;
        }
        #root > [id$="-prerendered"] ul {
          padding-left: 1.25rem;
        }
        #root > [id$="-prerendered"] li {
          margin: 0.4rem 0;
        }
        #root > [id$="-prerendered"] a {
          text-decoration: underline;
        }
      </style>
    </noscript>

    <!--
      LCP hero image. 6 Oct 2026: the preload carries the same srcset and sizes
      as the hero <img> (HeroSection.tsx) and the static shell below, so the
      browser fetches ONE file and all three reuse it. The widths come from
      Vercel Image Optimization ("images" in vercel.json), which serves AVIF or
      WebP: 21 KB at 828w and 59 KB at full size, against 196 KB for the JPG.
      Phones show the photo height-first (object-cover on an 86svh box), so
      the phone slot is 155vh wide, not 100vw. href stays the plain JPG for
      browsers that ignore imagesrcset.
    -->
    <link rel="preload" as="image" href="/hero-world.jpg" imagesrcset="/_vercel/image?url=%2Fhero-world.jpg&amp;w=828&amp;q=70 828w, /_vercel/image?url=%2Fhero-world.jpg&amp;w=1200&amp;q=70 1200w, /_vercel/image?url=%2Fhero-world.jpg&amp;w=1920&amp;q=70 1920w" imagesizes="(max-width: 767px) 155vh, 100vw" fetchpriority="high" />

      Fonts — the brand type system from the Klovers concept board:
        Poppins  display / headings

        Cairo    body and UI (Arabic; Inter ships no Arabic)
        Segoe Script / Kalam   Cluby's handwritten voice (see --font-script)
        Noto Sans KR  Hangul in lessons and the Hangul game
        Hi Melody     decorative Korean words (hero, culture, final CTA)

      HANDWRITING: Segoe Script is the preferred face and is NOT loaded here -
      it is a Windows system font (Microsoft-licensed, never bundle its files).
      Kalam is loaded as the cross-device fallback (Mac, iPhone, Android).
      Both are Latin-only: Arabic handwriting lines use Cairo instead (see
      .cluby-note in src/index.css). Aref Ruqaa and Nanum Pen Script were added here on 20 Sep 2026
      to close it and removed the same day - Ruqaa is a calligraphic naskh and
      looked like a thin formal serif at 20px, not like a hand. Closing the
      gap needs a face that genuinely looks handwritten in Arabic.

      Loaded with media="print" + onload swap so the stylesheet is fetched at
      low priority and never blocks first paint. The system stack stays as the
      fallback in tailwind.config.ts, so if Google Fonts is blocked or slow the
      page renders in system fonts instead of waiting on it.
    -->

    <!--
      Analytics run on the real site only.

      Until 18 Sep 2026 both tags below loaded everywhere, so every Vercel
      preview deployment and every localhost dev server reported into the
      production GA4 property and the production Meta Pixel. It showed up in
      GA4 Realtime as an acquisition source named after a preview branch
      URL - our own testing, recorded as traffic, with no way to separate it
      afterwards.

      A preview is not traffic. Anything that is not kloversegy.com (or a
      subdomain of it) now loads neither tag.
    -->
    <script>
      window.__klIsProdHost = /(^|\.)kloversegy\.com$/.test(window.location.hostname);
      /*
        Run fn after the page has finished loading, then waited, then the
        browser is idle (6 Oct 2026). requestIdleCallback alone fired about
        15ms after the HTML arrived, so on a slow phone the 110 KB Meta Pixel
        script and gtag downloaded alongside the app bundle and the hero
        picture - PageSpeed mobile measured LCP at 8.5s. Analytics still loads
        on every visit; it just no longer races the first paint.
      */
      window._klAfterLoad = function (fn, delay) {
        var go = function () {
          setTimeout(function () {
            if ('requestIdleCallback' in window) { requestIdleCallback(fn, { timeout: 4000 }); }
            else { fn(); }
          }, delay);
        };
        if (document.readyState === 'complete') { go(); }
        else { window.addEventListener('load', go, { once: true }); }
      };
    </script>

    <!--
      Cookie consent (24 Sep 2026). Both tags below start with consent DENIED
      unless this browser already pressed Accept on the cookie banner
      (localStorage cookie_consent = "granted"). The banner updates both tags
      when the visitor chooses - see src/lib/consent.ts, which uses the same key.
    -->
    <script>
      window.__klConsent = (function () {
        try {
          var v = localStorage.getItem('cookie_consent');
          return v === 'granted' || v === 'denied' ? v : null;
        } catch (e) {
          return null;
        }
      })();
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Google Consent Mode v2: set BEFORE any config call.
      var _klConsentState = window.__klConsent === 'granted' ? 'granted' : 'denied';
      gtag('consent', 'default', {
        analytics_storage: _klConsentState,
        ad_storage: _klConsentState,
        ad_user_data: _klConsentState,
        ad_personalization: _klConsentState
      });
      var _loadGA = function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L4JG9ZP7HL';
        s.async = true;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-L4JG9ZP7HL');
      };
      if (window.__klIsProdHost) { window._klAfterLoad(_loadGA, 1500); }
    </script>

    <!-- Meta Pixel — deferred; replace PIXEL_ID in .env: VITE_META_PIXEL_ID=your_id -->
    <script>
      var _loadPixel = function() {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        // Consent before init: revoked until the visitor presses Accept.
        fbq('consent', window.__klConsent === 'granted' ? 'grant' : 'revoke');
        var _pixelId = '%VITE_META_PIXEL_ID%';
        if (_pixelId && _pixelId !== '%VITE_META_PIXEL_ID%') {
          fbq('init', _pixelId);
          fbq('track', 'PageView');
        }
      };
      if (window.__klIsProdHost) { window._klAfterLoad(_loadPixel, 3000); }
    </script>

  <body>
    <!--
      Homepage hero shell (6 Oct 2026, revised the same day).

      Until the app's JavaScript ran, the homepage painted nothing (PageSpeed
      mobile: FCP 4.1s, LCP 8.5s). On "/" and "/ar" this shell paints the first
      screen straight from the HTML: the hero photo with the same crop, filter
      and scrim as HeroSection.tsx, plus the headline and the paragraph in the
      visitor's language. The language follows the same rules as
      LanguageProvider: /ar is Arabic, then ?lang=, then the saved choice.
      The real hero renders over it and removes it on mount (HeroSection
      useEffect). A 15s timer also removes it, in case the app never starts.
      Other routes never fill it, so they never fetch the picture.

      Two things measured on 6 Oct shaped this version:
      - Text, not only the photo. With a photo-only shell, React's own text
        could still be the first contentful paint, so Lighthouse charged all
        of the app's start-up work to FCP (4.5s). The headline here paints
        as soon as the CSS arrives.
      - The shell covers the WHOLE viewport (100vh), not 86svh. LCP takes a
        new candidate only when a later element is strictly larger. A
        86svh shell let React's hero photo, painted ~2s later, become the
        LCP. A shell that already fills the screen cannot be outgrown.

      KEEP THE COPY IN STEP with HeroSection.tsx (headline + paragraph).
    -->
    <style>
      #kl-hero-shell { position: absolute; top: 0; left: 0; right: 0; height: 100vh; overflow: hidden; background: #2E2E2E; pointer-events: none; z-index: 0; }
      #kl-hero-shell .kl-s-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 97% center; filter: brightness(1.1) saturate(1.15); }
      #kl-hero-shell .kl-s-scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(46,46,46,0.55) 0%, rgba(46,46,46,0.55) 45%, rgba(46,46,46,0.70) 100%); }
      #kl-hero-shell .kl-s-box { position: relative; height: 86vh; height: 86svh; display: flex; align-items: center; justify-content: center; padding: 6rem 1rem 6rem; box-sizing: border-box; text-align: center; }
      #kl-hero-shell .kl-s-col { max-width: 64rem; width: 100%; }
      #kl-hero-shell h2 { margin: 0; font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; color: #FFF9EC; text-shadow: 0 4px 40px rgba(20,20,18,0.9), 0 2px 8px rgba(20,20,18,0.8); }
      #kl-hero-shell h2 span { display: block; font-size: clamp(1.625rem, 7vw, 2.25rem); }
      #kl-hero-shell h2 span + span { margin-top: 0.25rem; color: #FFFF00; }
      #kl-hero-shell p { margin: 1.25rem auto 0; max-width: 42rem; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 1rem; line-height: 1.625; color: rgba(255,249,236,0.9); text-shadow: 0 1px 10px rgba(20,20,18,0.85); }
      #kl-hero-shell[dir="rtl"] h2, #kl-hero-shell[dir="rtl"] p { font-family: Cairo, system-ui, -apple-system, "Segoe UI", sans-serif; }
      @media (min-width: 640px) { #kl-hero-shell p { font-size: 1.125rem; } }
      @media (min-width: 768px) { #kl-hero-shell h2 span { font-size: clamp(2.25rem, 5vw, 3.75rem); } }
      @media (min-width: 1024px) {
        #kl-hero-shell .kl-s-img { object-position: center; }
        #kl-hero-shell .kl-s-col { margin-left: auto; margin-right: 4%; max-width: 56rem; }
      }
    </style>
    <div id="kl-hero-shell" aria-hidden="true" hidden></div>
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, "");
        if (path !== "" && path !== "/ar") return;
        var shell = document.getElementById("kl-hero-shell");
        if (!shell) return;

        var ar = path === "/ar";
        if (!ar) {
          var m = /[?&]lang=(en|ar)\b/.exec(window.location.search);
          if (m) { ar = m[1] === "ar"; }
          else { try { ar = localStorage.getItem("k-lovers-lang") === "ar"; } catch (e) { ar = false; } }
        }

        var local = /^(localhost|127\.0\.0\.1|0\.0\.0\.0)$|\.local$/.test(window.location.hostname);
        var srcset = local ? "" : [828, 1200, 1920].map(function (w) {
          return "/_vercel/image?url=%2Fhero-world.jpg&w=" + w + "&q=70 " + w + "w";
        }).join(", ");
        var img = document.createElement("img");
        img.className = "kl-s-img";
        img.alt = "";
        img.decoding = "async";
        img.setAttribute("fetchpriority", "high");
        if (srcset) { img.sizes = "(max-width: 767px) 155vh, 100vw"; img.srcset = srcset; }
        img.src = "/hero-world.jpg";
        shell.appendChild(img);

        var scrim = document.createElement("div");
        scrim.className = "kl-s-scrim";
        shell.appendChild(scrim);

        var copy = ar
          ? ["التحدّث بالكورية يبدأ", "من الحصة الأولى", "حصص كورية مباشرة أونلاين مع معلمة حقيقية، في مجموعات صغيرة، ومسار واضح من البداية حتى التحدث بثقة."]
          : ["Start Speaking Korean", "From Your First Live Class", "Live online Korean classes with a real teacher, small groups, and a clear path from beginner to confident conversation."];
        var box = document.createElement("div");
        box.className = "kl-s-box";
        var col = document.createElement("div");
        col.className = "kl-s-col";
        var h = document.createElement("h2");
        var l1 = document.createElement("span"); l1.textContent = copy[0];
        var l2 = document.createElement("span"); l2.textContent = copy[1];
        h.appendChild(l1); h.appendChild(l2);
        var p = document.createElement("p"); p.textContent = copy[2];
        col.appendChild(h); col.appendChild(p); box.appendChild(col); shell.appendChild(box);

        shell.setAttribute("dir", ar ? "rtl" : "ltr");
        shell.setAttribute("lang", ar ? "ar" : "en");
        shell.hidden = false;
        setTimeout(function () { if (shell.parentNode) shell.parentNode.removeChild(shell); }, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
