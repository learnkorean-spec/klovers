# Same trap, caught on its first day: send-trial-guide shipped without an
# entry here, deployed with verify_jwt = true, and the gateway answered
# 401 UNAUTHORIZED_INVALID_JWT_FORMAT to trigger_trial_guide() - before a
# single line of the function ran. The function does its own authorisation
# (isCronOrAdmin: cron secret verified against Vault, or an admin JWT), which
# is exactly why the gateway must not second-guess it.
[functions.send-trial-guide]
verify_jwt = false

# The trial-day reminder, every 15 minutes (trigger_trial_reminder). Same
# authorisation, so the same rule: the gateway must not second-guess it.
[functions.send-trial-reminder]
verify_jwt = false

# Manual, not cron - Re decides who gets a second ask - but it authorises the
# same way, so the same rule applies.
[functions.send-trial-reask]
verify_jwt = false

# Weekly signups + system-alerts report (trigger_weekly_report, Saturday
# 08:00 Cairo). Same rule as send-trial-guide above: this one authorises
# itself with isCronOrAdmin (cron secret via Vault, or an admin's own JWT —
# the AdminNotifications.tsx "Send now" button), so the gateway must not
# second-guess it with its own JWT check.
[functions.send-weekly-report]
verify_jwt = false

# The teacher's day-before brief (trigger_teacher_brief, hourly, sends on the
# 09:00-Cairo tick). Same rule again, and it matters more here than most: the
# brief carries student names and levels, so the function's own isCronOrAdmin
# check is the real gate and the gateway must not pre-empt it with a 401 that
# stops the cron call before any code runs.
[functions.send-teacher-brief]
verify_jwt = false

